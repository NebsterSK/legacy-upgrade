<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The logo square, same geometry as <UpgradeMark>. Fill mirrors the brand colour token in
       themes/palettes/tighten.css: an SVG favicon is its own document and cannot read
       the page's CSS variables, so this value must be updated with the palette. -->
  <rect width="100" height="100" rx="11" fill="#3c6492"/>
  <polygon transform="translate(19 19) scale(0.62)" points="50,6 94,50 68,50 68,94 32,94 32,50 6,50" fill="#ffffff"/>
</svg>
